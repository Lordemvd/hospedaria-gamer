<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Inn | Novo Cadastro</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="auth-page-body">

    <header class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration: none; color: inherit;">
                <span class="logo-highlight">NEXUS</span>INN
            </a>
        </div>
        <nav class="nav-links">
            <a href="../index.html">Voltar ao Início</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card auth-card-wide">
            <div class="auth-card-header">
                <span class="badge">NOVO JOGADOR</span>
                <h1 class="auth-title">CRIE SUA GAMER TAG</h1>
                <p class="auth-subtitle">Crie a sua conta para aceder aos quartos e configurações exclusivas.</p>
            </div>

            <form id="signupForm" class="auth-form">
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="fullName">Nome Completo</label>
                        <input type="text" id="fullName" placeholder="Lucas Silva" required>
                    </div>
                    <div class="form-group">
                        <label for="gamerTag">Gamer Tag</label>
                        <input type="text" id="gamerTag" placeholder="ShadowStriker" required>
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="signupEmail">E-mail</label>
                        <input type="email" id="signupEmail" placeholder="player@nexusinn.com" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF ou Documento</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPass">Senha</label>
                    <input type="password" id="newPass" placeholder="Mínimo de 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="confirmPass">Confirmar Senha</label>
                    <input type="password" id="confirmPass" placeholder="Repita a senha" required>
                    <small id="passError" class="input-error-msg" style="display: none;"></small>
                </div>

                <button type="submit" class="btn-primary btn-full-width">Concluir Registo</button>
            </form>

            <div class="auth-card-footer">
                <p>Já possui cadastro? <a href="login.html" class="link-highlight">Entrar na sua conta</a></p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.getElementById('signupForm');
            const passError = document.getElementById('passError');

            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                passError.style.display = 'none';

                const pass = document.getElementById('newPass').value;
                const confirm = document.getElementById('confirmPass').value;

                if (pass !== confirm) {
                    passError.textContent = 'As senhas não coincidem!';
                    passError.style.display = 'block';
                    return;
                }

                const fullName = document.getElementById('fullName').value.trim();
                const gamerTag = document.getElementById('gamerTag').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const cpf = document.getElementById('cpf').value.trim();

                let users = [];
                try {
                    const stored = localStorage.getItem('nexus_users');
                    users = stored ? JSON.parse(stored) : [];
                } catch (err) {
                    users = [];
                }

                if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                    passError.textContent = 'Este e-mail já se encontra registado!';
                    passError.style.display = 'block';
                    return;
                }

                if (users.some(u => u.gamerTag.toLowerCase() === gamerTag.toLowerCase())) {
                    passError.textContent = 'Esta GamerTag já está em uso!';
                    passError.style.display = 'block';
                    return;
                }

                users.push({
                    id: 'usr_' + Date.now(),
                    fullName,
                    gamerTag,
                    email,
                    cpf,
                    password: pass
                });

                localStorage.setItem('nexus_users', JSON.stringify(users));

                alert(`Conta criada com sucesso, ${gamerTag}! A redirecionar para a página de login...`);
                window.location.href = 'login.html';
            });
        });
    </script>
</body>

</html>
