<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Inn | Novo Cadastro</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">

<!-- SDK Oficial do Supabase + Arquivo de Conexão -->
  <!-- NOSONAR -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script defer src="../supabase.js"></script>
</head>

    <style>

        /* CYBER CAPTCHA AUTORAL */
    .captcha-group {
      margin-top: 6px;
    }

    .captcha-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #captchaCanvas {
      background: #090a12;
      border: 1px solid var(--border-glow, rgba(0, 240, 255, 0.4));
      border-radius: 4px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      cursor: not-allowed;
      user-select: none;
      flex-shrink: 0;
    }

    .btn-refresh-captcha {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--neon-cyan, #00f0ff);
      font-size: 1.1rem;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-refresh-captcha:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--neon-cyan, #00f0ff);
      transform: rotate(90deg);
    }

    #captchaInput {
      text-transform: uppercase;
      font-family: var(--font-display, 'Orbitron', monospace);
      letter-spacing: 2px;
      font-weight: 700;
      text-align: center;
      height: 42px;
    }


    </style>

</head>
<body class="auth-page-body">

  <header class="navbar">
    <div class="logo">
      <a href="../index.html" style="text-decoration: none; color: inherit;">
        <span class="logo-highlight">NEXUS</span>INN
      </a>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Voltar ao Início</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card auth-card-wide">
      <div class="auth-card-header">
        <span class="badge">NOVA CONTA</span>
        <h1 class="auth-title">CRIE SUA GAMERTAG</h1>
        <p class="auth-subtitle">Garanta vantagens VIP, ping prioritário e agilidade no check-in.</p>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="auth-grid-desktop">
          
          <!-- Linha 1: Nome e GamerTag -->
          <div class="form-group">
            <label for="fullName">Nome Completo</label>
            <input type="text" id="fullName" placeholder="Ex: Alex Mercer" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="gamerTag">GamerTag (Apelido Público)</label>
            <input type="text" id="gamerTag" placeholder="Ex: ShadowStriker" required autocomplete="username">
          </div>

          <!-- Linha 2: E-mail e CPF -->
          <div class="form-group">
            <label for="signupEmail">E-mail</label>
            <input type="email" id="signupEmail" placeholder="player@nexusinn.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required maxlength="14">
          </div>

          <!-- Linha 3: Senha e Confirmação -->
          <div class="form-group">
            <label for="newPass">Senha</label>
            <div class="input-password-wrapper" style="position: relative; display: flex; align-items: center;">
              <input type="password" id="newPass" placeholder="••••••••" required autocomplete="new-password" style="width: 100%; padding-right: 40px;">
              <button type="button" id="btnTogglePass" class="toggle-pass-btn" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem;" aria-label="Alternar visibilidade da senha">👁</button>
            </div>
            <div class="strength-meter-container" style="margin-top: 6px;">
              <div class="strength-bar" id="strengthBar"></div>
            </div>
            <span class="strength-text" id="strengthText" style="font-size: 0.76rem; color: var(--text-muted); margin-top: 3px; display: block;">Força da senha: digite uma senha</span>
          </div>

          <div class="form-group">
            <label for="confirmPass">Confirmar Senha</label>
            <input type="password" id="confirmPass" placeholder="••••••••" required autocomplete="new-password">
            <small id="passMatchError" class="input-error-msg" style="display: none; color: #ff6b8b; margin-top: 4px;">As senhas não coincidem!</small>
          </div>

          <!-- Linha 4: Captcha e Termos de Uso (Corrigido) -->

          <!-- VERIFICAÇÃO ANTI-BOT AUTORAL (CYBER CAPTCHA) -->
        <div class="form-group captcha-group">
          <label for="captchaInput">Protocolo Anti-Bot &bull; Digite o Código</label>
          <div class="captcha-box">
            <canvas id="captchaCanvas" width="160" height="42" title="Código de verificação"></canvas>
            <button type="button" id="btnRefreshCaptcha" class="btn-refresh-captcha" title="Gerar novo código" aria-label="Gerar novo código captcha">
              🔄
            </button>
            <input 
              type="text" 
              id="captchaInput" 
              placeholder="Código" 
              maxlength="6" 
              required 
              autocomplete="off"
              spellcheck="false"
            >
          </div>
          <small id="captchaError" class="input-error-msg" style="display: none;">Código incorreto. Tente novamente.</small>
        </div>

          <div class="terms-wrapper">
            <label class="terms-label" for="acceptTerms">
              <input type="checkbox" id="acceptTerms" required>
              <span>Concordo com os Termos de Uso e Políticas da Nexus Inn</span>
            </label>
          </div>

          <!-- Linha 5: Envio e Feedback -->
          <div class="auth-submit-row">
            <div id="signupFeedbackMsg" style="display: none; text-align: center; font-size: 0.95rem; margin-bottom: 8px; font-family: var(--font-display);"></div>
            <button type="submit" id="btnSignupSubmit" class="btn-primary btn-full-width">Criar Perfil Gamer</button>
          </div>

        </div>
      </form>

      <div class="auth-card-footer" style="margin-top: 16px;">
        <p>Já possui GamerTag? <a href="login.html" class="link-highlight">Fazer Login</a></p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signupForm');
      const newPass = document.getElementById('newPass');
      const confirmPass = document.getElementById('confirmPass');
      const btnToggle = document.getElementById('btnTogglePass');
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');
      const passMatchError = document.getElementById('passMatchError');
      const feedbackMsg = document.getElementById('signupFeedbackMsg');
      const btnSubmit = document.getElementById('btnSignupSubmit');
      const cpfInput = document.getElementById('cpf');

      // Máscara dinâmica de CPF (000.000.000-00)
      if (cpfInput) {
        cpfInput.addEventListener('input', (e) => {
          let v = e.target.value.replace(/\D/g, '').slice(0, 11);
          if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
          else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
          else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
          e.target.value = v;
        });
      }

      // Alternador de visibilidade da senha
      if (btnToggle && newPass) {
        btnToggle.addEventListener('click', () => {
          const isPass = newPass.type === 'password';
          newPass.type = isPass ? 'text' : 'password';
          confirmPass.type = isPass ? 'text' : 'password';
          btnToggle.style.color = isPass ? 'var(--neon-cyan)' : 'var(--text-muted)';
        });
      }

      // Medidor de força da senha
      if (newPass) {
        newPass.addEventListener('input', () => {
          const val = newPass.value;
          let score = 0;
          if (val.length >= 6) score++;
          if (/[A-Z]/.test(val)) score++;
          if (/[0-9]/.test(val)) score++;
          if (/[^A-Za-z0-9]/.test(val)) score++;

          if (val.length === 0) {
            strengthBar.style.width = '0%';
            strengthText.textContent = 'Força da senha: digite uma senha';
            strengthBar.style.backgroundColor = 'transparent';
          } else if (score <= 1) {
            strengthBar.style.width = '25%';
            strengthBar.style.backgroundColor = 'var(--neon-pink)';
            strengthText.textContent = 'Força da senha: Fraca';
          } else if (score <= 3) {
            strengthBar.style.width = '65%';
            strengthBar.style.backgroundColor = 'var(--neon-purple)';
            strengthText.textContent = 'Força da senha: Boa';
          } else {
            strengthBar.style.width = '100%';
            strengthBar.style.backgroundColor = 'var(--neon-cyan)';
            strengthText.textContent = 'Força da senha: Nível Boss';
          }
        });
      }

      // Envio para o Supabase
      if (signupForm) {
        signupForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          if (passMatchError) passMatchError.style.display = 'none';
          if (feedbackMsg) feedbackMsg.style.display = 'none';

          if (newPass.value !== confirmPass.value) {
            if (passMatchError) passMatchError.style.display = 'block';
            confirmPass.focus();
            return;
          }

    // ==========================================================================
    // CYBER CAPTCHA ANTI-BYPASS (SHA-256 & SCOPE ISOLATION)
    // ==========================================================================
        (function() {
             let expectedHash = null;
             const SALT = 'NEXUS_CAPTCHA_PROTECT_2026';

    // Função interna de hashing nativa do browser (Web Crypto API)
        async function sha256(str) {
             const buffer = new TextEncoder().encode(str + SALT);
              const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
         return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
         }

          function gerarStringAleatoria() {
              const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
              let res = '';
         for (let i = 0; i < 5; i++) {
         res += chars.charAt(Math.floor(Math.random() * chars.length));
         }
         return res;
         }

         async function desenharCaptcha() {
               const canvas = document.getElementById('captchaCanvas');
          if (!canvas) return;
             const ctx = canvas.getContext('2d');

              const rawCode = gerarStringAleatoria();
      expectedHash = await sha256(rawCode.toLowerCase());

     // Renderização com ruído visual anti-OCR
         ctx.fillStyle = '#06070a';
         ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Linhas de distorção
         for (let i = 0; i < 6; i++) {
           ctx.strokeStyle = i % 2 === 0 ? '#00f0ff' : '#ff0055';
           ctx.lineWidth = 1.2;
           ctx.beginPath();
           ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
           ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
           ctx.stroke();
         }

      // Caracteres com rotação aleatória
           ctx.font = 'bold 24px Orbitron, monospace';
      for (let i = 0; i < rawCode.length; i++) {
           ctx.fillStyle = i % 2 === 0 ? '#00f0ff' : '#00ffaa';
           ctx.save();
           ctx.translate(22 + (i * 26), 34);
           ctx.rotate((Math.random() - 0.5) * 0.4);
           ctx.fillText(rawCode[i], 0, 0);
           ctx.restore();
          }
         }

     // Bloqueio de clique direito para descarregar a imagem
         const canvasEl = document.getElementById('captchaCanvas');
     if (canvasEl) {
          canvasEl.addEventListener('contextmenu', e => e.preventDefault());
          canvasEl.style.userSelect = 'none';
     }

    // Exposição única da validação assíncrona blindada
         window.verificarCyberCaptcha = async function(userInput) {
         if (!userInput || !expectedHash) return false;
            const inputHash = await sha256(userInput.trim().toLowerCase());
       return inputHash === expectedHash;
     };

         window.reiniciarCyberCaptcha = desenharCaptcha;
         document.addEventListener('DOMContentLoaded', desenharCaptcha);
        })();
          if (btnSubmit) {
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Gravando no banco...';
          }

          const fullName = document.getElementById('fullName').value.trim();
          const gamerTag = document.getElementById('gamerTag').value.trim();
          const email = document.getElementById('signupEmail').value.trim();
          const password = newPass.value;

          try {
            if (typeof registerUserInDB !== 'function') {
              throw new Error('Função de banco não inicializada.');
            }

            const result = await registerUserInDB({
              fullName,
              gamerTag,
              email,
              password
            });

            if (!result.success) {
              if (feedbackMsg) {
                feedbackMsg.textContent = result.message;
                feedbackMsg.style.color = '#ff6b8b';
                feedbackMsg.style.display = 'block';
              } else {
                alert(result.message);
              }
              if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Criar Perfil Gamer';
              }
              return;
            }

            if (feedbackMsg) {
              feedbackMsg.textContent = `✅ Conta criada com sucesso para ${gamerTag}! Redirecionando para login...`;
              feedbackMsg.style.color = 'var(--neon-cyan)';
              feedbackMsg.style.display = 'block';
            }

            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);

          } catch (err) {
            console.error(err);
            if (feedbackMsg) {
              feedbackMsg.textContent = err.message || 'Erro de conexão com o Supabase.';
              feedbackMsg.style.color = '#ff6b8b';
              feedbackMsg.style.display = 'block';
            }
            if (btnSubmit) {
              btnSubmit.disabled = false;
              btnSubmit.textContent = 'Criar Perfil Gamer';
            }
          }
        });
      }
    });

// ==========================================
      // MOTOR AUTORAL DO CYBER CAPTCHA
      // ==========================================
      const canvas = document.getElementById('captchaCanvas');
      const captchaInput = document.getElementById('captchaInput');
      const captchaError = document.getElementById('captchaError');
      const btnRefresh = document.getElementById('btnRefreshCaptcha');
      let currentCaptchaCode = '';

      function gerarCodigoAleatorio() {
        // Caracteres sem ambiguidade visual (sem 0, O, 1, I, l)
        const caracteres = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let codigo = '';
        for (let i = 0; i < 5; i++) {
          codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
        }
        return codigo;
      }

      function desenharCaptcha() {
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        currentCaptchaCode = gerarCodigoAleatorio();

        // 1. Fundo do terminal
        ctx.fillStyle = '#090a12';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Linhas de interferência cibernética (Scanlines / Glitch)
        for (let i = 0; i < 4; i++) {
          ctx.strokeStyle = i % 2 === 0 ? 'rgba(0, 240, 255, 0.45)' : 'rgba(255, 0, 127, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
          ctx.bezierCurveTo(
            Math.random() * canvas.width, Math.random() * canvas.height,
            Math.random() * canvas.width, Math.random() * canvas.height,
            Math.random() * canvas.width, Math.random() * canvas.height
          );
          ctx.stroke();
        }

        // 3. Ruído de partículas (fator anti-OCR para bots)
        for (let i = 0; i < 35; i++) {
          ctx.fillStyle = i % 2 === 0 ? '#00f0ff' : '#b026ff';
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. Renderização dos caracteres estilizados com rotação individual
        const cores = ['#00f0ff', '#b026ff', '#ff007f', '#00ffaa', '#ffffff'];
        ctx.font = 'bold 22px "Orbitron", monospace, sans-serif';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < currentCaptchaCode.length; i++) {
          const char = currentCaptchaCode[i];
          const x = 20 + i * 26;
          const y = canvas.height / 2;
          const angulo = (Math.random() - 0.5) * 0.4; // Inclinação leve

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angulo);
          ctx.fillStyle = cores[Math.floor(Math.random() * cores.length)];
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 6;
          ctx.fillText(char, -8, 2);
          ctx.restore();
        }
      }

      // Inicializa o captcha e liga o botão de regerar
      desenharCaptcha();
      if (btnRefresh) {
        btnRefresh.addEventListener('click', () => {
          desenharCaptcha();
          captchaInput.value = '';
          if (captchaError) captchaError.style.display = 'none';
        });
      }

  </script>
</body>
</html>
