<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Inn | Novo Cadastro</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">

  <!-- SDK Oficial do Supabase + Arquivo de Conexão -->
  <!-- NOSONAR -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr" crossorigin="anonymous"></script>
  <script defer src="../supabase.js"></script>
</head>
<body class="auth-page-body">

  <header class="navbar">
    <div class="logo">
      <a href="../index.html" style="text-decoration: none; color: inherit;">
        <span class="logo-highlight">NEXUS</span>INN
      </a>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Voltar ao Início</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card auth-card-wide">
      <div class="auth-card-header">
        <span class="badge">NOVO JOGADOR</span>
        <h1 class="auth-title">CRIE SUA CONTA</h1>
        <p class="auth-subtitle">Registre seu perfil gamer com persistência direta na nuvem.</p>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="form-row-2">
          <div class="form-group">
            <label for="fullName">Nome Completo</label>
            <input type="text" id="fullName" placeholder="Ex: Lucas Silva" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="gamerTag">Gamer Tag / Nickname</label>
            <input type="text" id="gamerTag" placeholder="Ex: ShadowStriker" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="signupEmail">E-mail</label>
          <input type="email" id="signupEmail" placeholder="player@nexusinn.com" required autocomplete="email">
        </div>

        <!-- SENHA COM MEDIDOR VISUAL -->
        <div class="form-group">
          <label for="newPass">Senha de Acesso</label>
          <div class="input-password-wrapper" style="position: relative; display: flex; align-items: center;">
            <input type="password" id="newPass" placeholder="Mínimo de 6 caracteres" required autocomplete="new-password" style="width: 100%; padding-right: 40px;">
            <button type="button" id="btnTogglePass" class="toggle-pass-btn" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem;" aria-label="Alternar visibilidade da senha">👁</button>
          </div>
          <div class="strength-meter-container" style="margin-top: 8px;">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <span class="strength-text" id="strengthText" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: block;">Força da senha: digite uma senha</span>
        </div>

        <div class="form-group">
          <label for="confirmPass">Confirmar Senha</label>
          <input type="password" id="confirmPass" placeholder="Repita a mesma senha" required autocomplete="new-password">
          <small id="passMatchError" class="input-error-msg" style="display: none; color: #ff6b8b; margin-top: 4px;">As senhas não coincidem!</small>
        </div>

        <!-- Feedback de erro ou sucesso -->
        <div id="signupFeedbackMsg" style="display: none; text-align: center; font-size: 0.95rem; margin-top: 10px; font-family: var(--font-display);"></div>

        <button type="submit" id="btnSignupSubmit" class="btn-primary btn-full-width" style="margin-top: 14px;">Criar Perfil Gamer</button>
      </form>

      <div class="auth-card-footer">
        <p>Já possui cadastro? <a href="login.html" class="link-highlight">Entrar na sua conta</a></p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signupForm');
      const newPass = document.getElementById('newPass');
      const confirmPass = document.getElementById('confirmPass');
      const btnToggle = document.getElementById('btnTogglePass');
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');
      const passMatchError = document.getElementById('passMatchError');
      const feedbackMsg = document.getElementById('signupFeedbackMsg');
      const btnSubmit = document.getElementById('btnSignupSubmit');

      // 1. Alternador da visibilidade da senha
      if (btnToggle && newPass) {
        btnToggle.addEventListener('click', () => {
          const isPass = newPass.type === 'password';
          newPass.type = isPass ? 'text' : 'password';
          confirmPass.type = isPass ? 'text' : 'password';
          btnToggle.style.color = isPass ? 'var(--neon-cyan)' : 'var(--text-muted)';
        });
      }

      // 2. Medidor dinâmico de força da senha
      if (newPass) {
        newPass.addEventListener('input', () => {
          const val = newPass.value;
          let score = 0;
          if (val.length >= 6) score++;
          if (/[A-Z]/.test(val)) score++;
          if (/[0-9]/.test(val)) score++;
          if (/[^A-Za-z0-9]/.test(val)) score++;

          if (val.length === 0) {
            strengthBar.style.width = '0%';
            strengthText.textContent = 'Força da senha: digite uma senha';
            strengthBar.style.backgroundColor = 'transparent';
          } else if (score <= 1) {
            strengthBar.style.width = '25%';
            strengthBar.style.backgroundColor = 'var(--neon-pink)';
            strengthText.textContent = 'Força da senha: Fraca';
          } else if (score <= 3) {
            strengthBar.style.width = '65%';
            strengthBar.style.backgroundColor = 'var(--neon-purple)';
            strengthText.textContent = 'Força da senha: Boa';
          } else {
            strengthBar.style.width = '100%';
            strengthBar.style.backgroundColor = 'var(--neon-cyan)';
            strengthText.textContent = 'Força da senha: Nível Boss';
          }
        });
      }

      // 3. Envio e gravação na tabela 'users' do Supabase
      if (signupForm) {
        signupForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          if (passMatchError) passMatchError.style.display = 'none';
          if (feedbackMsg) feedbackMsg.style.display = 'none';

          if (newPass.value !== confirmPass.value) {
            if (passMatchError) passMatchError.style.display = 'block';
            confirmPass.focus();
            return;
          }

          if (btnSubmit) {
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Gravando no banco...';
          }

          const fullName = document.getElementById('fullName').value.trim();
          const gamerTag = document.getElementById('gamerTag').value.trim();
          const email = document.getElementById('signupEmail').value.trim();
          const password = newPass.value;

          try {
            if (typeof registerUserInDB !== 'function') {
              throw new Error('Função registerUserInDB não encontrada no supabase.js.');
            }

            const result = await registerUserInDB({
              fullName,
              gamerTag,
              email,
              password
            });

            if (!result.success) {
              if (feedbackMsg) {
                feedbackMsg.textContent = result.message;
                feedbackMsg.style.color = '#ff6b8b';
                feedbackMsg.style.display = 'block';
              } else {
                alert(result.message);
              }

              if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Criar Perfil Gamer';
              }
              return;
            }

            // Feedback de sucesso imediato
            if (feedbackMsg) {
              feedbackMsg.textContent = `✅ Conta criada com sucesso para ${gamerTag}! Entrando no login...`;
              feedbackMsg.style.color = 'var(--neon-cyan)';
              feedbackMsg.style.display = 'block';
            }

            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);

          } catch (err) {
            console.error(err);
            if (feedbackMsg) {
              feedbackMsg.textContent = err.message || 'Erro ao conectar ao banco.';
              feedbackMsg.style.color = '#ff6b8b';
              feedbackMsg.style.display = 'block';
            }
            if (btnSubmit) {
              btnSubmit.disabled = false;
              btnSubmit.textContent = 'Criar Perfil Gamer';
            }
          }
        });
      }
    });
  </script>
</body>
</html>
