<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Inn | Criar Conta</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300f0ff'/%3E%3Ctext x='50' y='65' font-size='48' text-anchor='middle' fill='%2307080c'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">

  <!-- SDK Oficial do Supabase + Conexão -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../supabase.js"></script>

  <style>
    .auth-page-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 20%, #151829 0%, var(--bg-dark, #0a0b10) 80%) no-repeat center center fixed;
      background-size: cover;
      background-color: #07080c;
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px;
      width: 100%;
    }

    .auth-card-wide {
      background: #0d0f18;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 10px;
      max-width: 680px;
      width: 100%;
      padding: 32px 36px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.15);
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-card-header h1 {
      font-family: var(--font-display, 'Orbitron', sans-serif);
      font-size: 1.6rem;
      color: #ffffff;
      margin: 8px 0 4px 0;
    }

    .auth-card-header p {
      color: var(--text-muted, #94a3b8);
      font-size: 0.95rem;
      margin: 0;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .form-row-2 {
        grid-template-columns: 1fr;
      }
      .auth-card-wide {
        padding: 24px 20px;
      }
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-family: var(--font-display, 'Orbitron', sans-serif);
      font-size: 0.78rem;
      color: var(--text-muted, #94a3b8);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      background: #07080c;
      border: 1px solid #1f2338;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: var(--font-body, 'Rajdhani', sans-serif);
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--neon-cyan, #00f0ff);
    }

    /* ESTILOS DO CYBER CAPTCHA */
    .captcha-container {
      background: #080910;
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .captcha-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .canvas-wrap {
      position: relative;
      display: inline-block;
      user-select: none;
      -webkit-user-select: none;
    }

    #captchaCanvas {
      background: #05060a;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 4px;
      cursor: not-allowed;
      display: block;
    }

    /* Camada transparente anti-download */
    .canvas-shield {
      position: absolute;
      inset: 0;
      background: transparent;
      cursor: not-allowed;
    }

    .btn-refresh-captcha {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--neon-cyan, #00f0ff);
      width: 42px;
      height: 42px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .btn-refresh-captcha:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--neon-cyan, #00f0ff);
      transform: rotate(90deg);
    }

    .captcha-input-field {
      flex: 1;
      min-width: 140px;
    }

    .captcha-input-field input {
      text-transform: uppercase;
      font-family: var(--font-display, 'Orbitron', monospace);
      letter-spacing: 2px;
      text-align: center;
      font-weight: 700;
      height: 42px;
    }

    .input-error-msg {
      color: #ff6b8b;
      font-size: 0.8rem;
      margin-top: 6px;
      display: block;
    }

    .terms-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .terms-row input[type="checkbox"] {
      accent-color: var(--neon-cyan, #00f0ff);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body class="auth-page-body">

  <header class="navbar">
    <div class="logo">
      <a href="../index.html" style="text-decoration: none; color: inherit;">
        <span class="logo-highlight">NEXUS</span>INN
      </a>
    </div>
    <nav class="nav-links" aria-label="Navegação principal">
      <a href="../index.html">Voltar ao Início</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card-wide">
      <div class="auth-card-header">
        <span class="badge">REGISTRO DE ACESSO</span>
        <h1>CRIE SUA GAMERTAG</h1>
        <p>Cadastre sua credencial oficial para reservar setups e obter seu Gamer Pass.</p>
      </div>

      <form id="signupForm">
        <div class="form-row-2">
          <div class="form-group">
            <label for="fullName">Nome Completo</label>
            <input type="text" id="fullName" placeholder="Ex: Gabriel Souza" required>
          </div>
          <div class="form-group">
            <label for="gamerTag">GamerTag (3 a 16 caracteres)</label>
            <input 
              type="text" 
              id="gamerTag" 
              placeholder="Ex: Shadow_21" 
              maxlength="16" 
              required 
              pattern="^[a-zA-Z0-9_-]{3,16}$" 
              title="A GamerTag deve conter de 3 a 16 caracteres (letras, números, hífen e underline)."
            >
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="signupEmail">E-mail Principal</label>
            <input type="email" id="signupEmail" placeholder="seu-email@dominio.com" required>
          </div>
          <div class="form-group">
            <label for="cpf">CPF (apenas números)</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="newPass">Senha de Acesso</label>
            <input type="password" id="newPass" placeholder="Mínimo de 6 caracteres" minlength="6" required>
          </div>
          <div class="form-group">
            <label for="confirmPass">Confirmar Senha</label>
            <input type="password" id="confirmPass" placeholder="Repita a senha" minlength="6" required>
            <small id="passError" class="input-error-msg" style="display: none;"></small>
          </div>
        </div>

        <!-- PROTOCOLO DE SEGURANÇA: CYBER CAPTCHA -->
        <div class="captcha-container">
          <label style="display: block; font-family: var(--font-display); font-size: 0.78rem; color: var(--neon-cyan); margin-bottom: 8px;">
            VERIFICAÇÃO DE SEGURANÇA
          </label>
          <div class="captcha-row">
            <div class="canvas-wrap">
              <canvas id="captchaCanvas" width="160" height="42" title="Código de verificação"></canvas>
              <!-- Bloqueador transparente que intercepta o clique do mouse -->
              <div class="canvas-shield" id="canvasShield"></div>
            </div>

            <button type="button" id="btnRefreshCaptcha" class="btn-refresh-captcha" title="Gerar novo código" aria-label="Gerar novo código">
              🔄
            </button>

            <div class="captcha-input-field">
              <input 
                type="text" 
                id="captchaInput" 
                placeholder="DIGITE O CÓDIGO" 
                maxlength="6" 
                required 
                autocomplete="off" 
                spellcheck="false"
              >
            </div>
          </div>
          <small id="captchaError" class="input-error-msg" style="display: none;"></small>
        </div>

        <div class="terms-row">
          <input type="checkbox" id="termsCheck" required>
          <label for="termsCheck">Li e concordo com as diretrizes e regras de estadia da Nexus Inn.</label>
        </div>

        <button type="submit" id="btnSubmitForm" class="btn-primary btn-full-width" style="padding: 12px; font-size: 1rem; cursor: pointer;">
          Concluir Cadastro
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8;">
        Já possui uma conta? <a href="login.html" style="color: var(--neon-cyan); font-weight: 700; text-decoration: none;">Acessar credencial &rarr;</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 Nexus Inn - Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- MOTOR CRIPTOGRÁFICO DO CYBER CAPTCHA (IIFE - ESCOPO PRIVADO) -->
  <script>
    (function() {
      let expectedHash = null;
      const SALT = 'NEXUS_CORE_SECURE_SALT_2026';

      async function computeHash(text) {
        const buffer = new TextEncoder().encode(text + SALT);
        const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }

      function generateRandomString() {
        // Caracteres legíveis sem ambiguidade (sem 0, O, 1, I, l)
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 5; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
      }

      async function renderCyberCaptcha() {
        const canvas = document.getElementById('captchaCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const rawCode = generateRandomString();
        expectedHash = await computeHash(rawCode.toLowerCase());

        // Fundo escuro com micro gradiente
        ctx.fillStyle = '#05060a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Linhas de interferência (Glitch lines)
        for (let i = 0; i < 5; i++) {
          ctx.strokeStyle = i % 2 === 0 ? 'rgba(0, 240, 255, 0.4)' : 'rgba(255, 0, 85, 0.4)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
          ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
          ctx.stroke();
        }

        // Ruído de partículas
        for (let i = 0; i < 30; i++) {
          ctx.fillStyle = i % 2 === 0 ? '#00f0ff' : '#00ffaa';
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // Renderização dos caracteres com inclinação aleatória
        const palette = ['#00f0ff', '#00ffaa', '#ff0055', '#ffffff'];
        ctx.font = 'bold 22px "Orbitron", monospace';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < rawCode.length; i++) {
          const char = rawCode[i];
          const x = 18 + (i * 26);
          const y = canvas.height / 2;
          const tilt = (Math.random() - 0.5) * 0.4;

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(tilt);
          ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 6;
          ctx.fillText(char, -8, 2);
          ctx.restore();
        }
      }

      // Bloqueio rigoroso de clique direito e arrasto no canvas e no protetor
      ['captchaCanvas', 'canvasShield'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('contextmenu', e => e.preventDefault());
          el.addEventListener('dragstart', e => e.preventDefault());
        }
      });

      // Validação assíncrona única exposta ao escopo do formulário
      window.validateCyberCaptcha = async function(userInput) {
        if (!userInput || !expectedHash) return false;
        const candidateHash = await computeHash(userInput.trim().toLowerCase());
        return candidateHash === expectedHash;
      };

      window.reloadCyberCaptcha = renderCyberCaptcha;
      document.addEventListener('DOMContentLoaded', renderCyberCaptcha);
    })();
  </script>

  <!-- LÓGICA DO FORMULÁRIO DE CADASTRO -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signupForm');
      const passError = document.getElementById('passError');
      const captchaError = document.getElementById('captchaError');
      const btnRefresh = document.getElementById('btnRefreshCaptcha');
      const btnSubmit = document.getElementById('btnSubmitForm');
      const captchaInput = document.getElementById('captchaInput');

      // Botão de regerar captcha
      if (btnRefresh) {
        btnRefresh.addEventListener('click', () => {
          if (typeof window.reloadCyberCaptcha === 'function') {
            window.reloadCyberCaptcha();
            captchaInput.value = '';
            captchaError.style.display = 'none';
          }
        });
      }

      // Máscara dinâmica de CPF
      const cpfInput = document.getElementById('cpf');
      if (cpfInput) {
        cpfInput.addEventListener('input', (e) => {
          let v = e.target.value.replace(/\D/g, '');
          if (v.length > 11) v = v.substring(0, 11);
          if (v.length > 9) {
            v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
          } else if (v.length > 6) {
            v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
          } else if (v.length > 3) {
            v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
          }
          e.target.value = v;
        });
      }

      // Submissão do formulário
      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        passError.style.display = 'none';
        captchaError.style.display = 'none';

        const pass = document.getElementById('newPass').value;
        const confirm = document.getElementById('confirmPass').value;

        // 1. Validação de Senha
        if (pass !== confirm) {
          passError.textContent = 'As senhas não coincidem!';
          passError.style.display = 'block';
          document.getElementById('confirmPass').focus();
          return;
        }

        // 2. BARREIRA ZERO: Validação Criptográfica do Cyber Captcha
        const isCaptchaValid = typeof window.validateCyberCaptcha === 'function' 
          ? await window.validateCyberCaptcha(captchaInput.value)
          : false;

        if (!isCaptchaValid) {
          captchaError.textContent = 'Código de verificação incorreto. Tente novamente.';
          captchaError.style.display = 'block';
          captchaInput.value = '';
          captchaInput.focus();
          if (typeof window.reloadCyberCaptcha === 'function') {
            window.reloadCyberCaptcha();
          }
          return;
        }

        // 3. Captura dos Dados Sanitizados
        const fullName = document.getElementById('fullName').value.trim();
        const gamerTag = document.getElementById('gamerTag').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const cpf = document.getElementById('cpf').value.trim();

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Gravando perfil...';

        // 4. Gravação Segura no Supabase com Trava Anti-Duplicidade
        if (typeof registerUserInDB === 'function') {
          const result = await registerUserInDB({
            fullName,
            gamerTag,
            email,
            cpf,
            password: pass
          });

          if (!result.success) {
            alert(result.message);
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Concluir Cadastro';
            if (typeof window.reloadCyberCaptcha === 'function') {
              window.reloadCyberCaptcha();
              captchaInput.value = '';
            }
            return;
          }

          alert(`🎉 Perfil criado com sucesso! Seja bem-vindo à Nexus Inn, ${gamerTag}!`);
          window.location.href = 'login.html';
        } else {
          // Fallback caso a conexão remota não responda
          alert('Serviço temporariamente indisponível. Tente novamente em instantes.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Concluir Cadastro';
        }
      });
    });
  </script>
</body>
</html>
