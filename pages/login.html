<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Inn | Login do Jogador</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">

  <!-- SDK Oficial do Supabase + Arquivo de Conexão -->
  <!-- NOSONAR -->
  <script defer src="../supabase-sdk.js"></script>
  <script defer src="../supabase.js"></script>
</head>
<body class="auth-page-body">

  <header class="navbar">
    <div class="logo">
      <a href="../index.html" style="text-decoration: none; color: inherit;">
        <span class="logo-highlight">NEXUS</span>INN
      </a>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Voltar ao Início</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <span class="badge">PLAYER ACCESS</span>
        <h1 class="auth-title">FAÇA SEU LOGIN</h1>
        <p class="auth-subtitle">Acesse suas reservas, histórico de estadias e pedidos do bar.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">E-mail ou GamerTag</label>
          <input type="text" id="loginEmail" placeholder="player@nexusinn.com ou GamerTag" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="loginPass">Senha</label>
          <div class="input-password-wrapper" style="position: relative; display: flex; align-items: center;">
            <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password" style="width: 100%; padding-right: 40px;">
            <button type="button" id="btnTogglePass" class="toggle-pass-btn" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem;" aria-label="Alternar visibilidade da senha">👁</button>
          </div>
        </div>

        <!-- Mensagem de feedback/erro -->
        <div id="loginErrorMsg" style="display: none; color: #ff6b8b; text-align: center; font-size: 0.9rem; margin-top: 10px; font-family: var(--font-display);"></div>

        <button type="submit" id="btnLoginSubmit" class="btn-primary btn-full-width" style="margin-top: 16px;">Iniciar Sessão</button>
      </form>

      <div class="auth-card-footer">
        <p>Ainda não tem conta? <a href="cadastro.html" class="link-highlight">Criar GamerTag</a></p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Alternador da visibilidade da senha
      const passInput = document.getElementById('loginPass');
      const btnToggle = document.getElementById('btnTogglePass');

      if (btnToggle && passInput) {
        btnToggle.addEventListener('click', () => {
          if (passInput.type === 'password') {
            passInput.type = 'text';
            btnToggle.style.color = 'var(--neon-cyan)';
          } else {
            passInput.type = 'password';
            btnToggle.style.color = 'var(--text-muted)';
          }
        });
      }

      // 2. Processamento do login com o Supabase
      const loginForm = document.getElementById('loginForm');
      const errorMsg = document.getElementById('loginErrorMsg');
      const submitBtn = document.getElementById('btnLoginSubmit');

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          if (errorMsg) {
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';
          }

          const identifier = document.getElementById('loginEmail').value.trim();
          const password = passInput.value;

          if (!identifier || !password) return;

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Autenticando...';
          }

          try {
            if (typeof loginUserInDB !== 'function') {
              throw new Error('Script supabase.js não carregado ou função indisponível.');
            }

            const result = await loginUserInDB(identifier, password);

            if (!result.success) {
              if (errorMsg) {
                errorMsg.textContent = result.message || 'Usuário ou senha inválidos.';
                errorMsg.style.display = 'block';
              } else {
                alert(result.message || 'Usuário ou senha inválidos.');
              }

              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Iniciar Sessão';
              }
              return;
            }

            // Armazena a sessão com perfil (admin/user)
            localStorage.setItem('nexus_current_user', JSON.stringify(result.user));

            // 3. REDIRECIONAMENTO INTELIGENTE: Verifica se o usuário veio barrado da reserva
            const urlParams = new URLSearchParams(window.location.search);
            const redirectTarget = urlParams.get('redirect');

            if (redirectTarget) {
              alert(`🎮 Login confirmado: Bem-vindo, ${result.user.gamerTag}! Retornando à sua reserva...`);
              window.location.href = decodeURIComponent(redirectTarget);
            } else if (result.user.role === 'admin') {
              alert(`🛡️ Painel Master: Bem-vindo, Administrador ${result.user.gamerTag}!`);
              window.location.href = 'admin.html';
            } else {
              alert(`🎮 Login confirmado: Bem-vindo, ${result.user.gamerTag}!`);
              window.location.href = '../index.html';
            }

          } catch (err) {
            console.error('Falha no login:', err);
            if (errorMsg) {
              errorMsg.textContent = err.message || 'Erro de conexão com o banco de dados.';
              errorMsg.style.display = 'block';
            } else {
              alert(err.message || 'Erro de conexão.');
            }

            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Iniciar Sessão';
            }
          }
        });
      }
    
    });
  </script>
</body>
</html>
