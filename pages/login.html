<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Inn | Login do Jogador</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
</head>
<body class="auth-page-body">

  <header class="navbar">
    <div class="logo">
      <a href="../index.html" style="text-decoration: none; color: inherit;">
        <span class="logo-highlight">NEXUS</span>INN
      </a>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Voltar ao Início</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <span class="badge">PLAYER ACCESS</span>
        <h1 class="auth-title">FAÇA SEU LOGIN</h1>
        <p class="auth-subtitle">Acesse suas reservas, histórico de estadias e pedidos do bar.</p>
      </div>

      <div id="loginFeedback" style="display: none; padding: 10px; margin-bottom: 16px; border-radius: 4px; font-size: 0.9rem; text-align: center;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">E-mail ou GamerTag</label>
          <input type="text" id="loginEmail" placeholder="player@nexusinn.com ou GamerTag" required>
        </div>

        <div class="form-group">
          <div class="label-with-link">
            <label for="loginPass">Senha</label>
          </div>
          <div class="input-password-wrapper">
            <input type="password" id="loginPass" placeholder="••••••••" required>
            <button type="button" class="toggle-pass-btn" id="togglePassBtn" aria-label="Mostrar ou ocultar senha">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full-width">Iniciar Sessão</button>
      </form>

      <div class="auth-card-footer">
        <p>Ainda não tem conta? <a href="cadastro.html" class="link-highlight">Criar GamerTag</a></p>
      </div>
    </div>
  </main>

  <script src="../auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const feedback = document.getElementById('loginFeedback');
      const passInput = document.getElementById('loginPass');
      const toggleBtn = document.getElementById('togglePassBtn');

      toggleBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          toggleBtn.style.color = 'var(--neon-cyan)';
        } else {
          passInput.type = 'password';
          toggleBtn.style.color = 'var(--text-muted)';
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const identifier = document.getElementById('loginEmail').value;
        const password = passInput.value;

        const res = loginUser(identifier, password);

        if (res.success) {
          feedback.style.display = 'block';
          feedback.style.background = 'rgba(0, 240, 255, 0.15)';
          feedback.style.border = '1px solid var(--neon-cyan)';
          feedback.style.color = 'var(--neon-cyan)';
          feedback.textContent = `Acesso autorizado! Bem-vindo, ${res.user.gamerTag}!`;

          setTimeout(() => {
            window.location.href = '../index.html';
          }, 1000);
        } else {
          feedback.style.display = 'block';
          feedback.style.background = 'rgba(255, 0, 85, 0.15)';
          feedback.style.border = '1px solid #ff0055';
          feedback.style.color = '#ff6b8b';
          feedback.textContent = res.message;
        }
      });
    });
  </script>
</body>
</html>
