<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Inn | Login do Jogador</title>
  <link rel="stylesheet" href="../style.css">
  <!-- SDK Oficial do Supabase -->
  <!-- NOSONAR -->
  <script defer src="../supabase-sdk.js"></script>
  <script defer src="../supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
</head>
<body class="auth-page-body">

  <header class="navbar">
    <div class="logo">
      <a href="../index.html" style="text-decoration: none; color: inherit;">
        <span class="logo-highlight">NEXUS</span>INN
      </a>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Voltar ao Início</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <span class="badge">PLAYER ACCESS</span>
        <h1 class="auth-title">FAÇA SEU LOGIN</h1>
        <p class="auth-subtitle">Acesse suas reservas, histórico de estadias e pedidos do bar.</p>
      </div>

      <div id="loginFeedback" style="display: none; padding: 10px; margin-bottom: 16px; border-radius: 4px; font-size: 0.9rem; text-align: center;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">E-mail ou GamerTag</label>
          <input type="text" id="loginEmail" placeholder="player@nexusinn.com ou GamerTag" required>
        </div>

        <div class="form-group">
          <div class="label-with-link">
            <label for="loginPass">Senha</label>
          </div>
          <div class="input-password-wrapper">
            <input type="password" id="loginPass" placeholder="••••••••" required>
            <button type="button" class="toggle-pass-btn" id="togglePassBtn" aria-label="Mostrar ou ocultar senha">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full-width">Iniciar Sessão</button>
      </form>

      <div class="auth-card-footer">
        <p>Ainda não tem conta? <a href="cadastro.html" class="link-highlight">Criar GamerTag</a></p>
      </div>
    </div>
  </main>

  <script src="../auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const errorMsg = document.getElementById('loginErrorMsg');
      const submitBtn = loginForm ? loginForm.querySelector('button[type="submit"]') : null;

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';

        const identifier = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPass').value;

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Acessando setup...';
        }

        const result = await loginUserInDB(identifier, password);

        if (!result.success) {
          errorMsg.textContent = result.message;
          errorMsg.style.display = 'block';
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar no Setup';
          }
          return;
        }

        // Registo da sessão ativa (com suporte ao perfil admin/user)
        localStorage.setItem('nexus_current_user', JSON.stringify(result.user));

        if (result.user.role === 'admin') {
          alert(`Sessão de Administrador iniciada: Bem-vindo, ${result.user.gamerTag}!`);
        }

        window.location.href = '../index.html';
      });
    });
  </script>
</body>
</html>
